<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PEP briefing desk</title>
  <link rel="stylesheet" href="/static/styles.css?v=3">
</head>
<body>
  <header class="mast">
    <div>
      <p class="eyebrow">Python 3.15 docs and PEPs</p>
      <h1>PEP briefing desk</h1>
    </div>
    <p class="memory">This tab keeps the conversation. A refresh starts over. The server does not store it.</p>
  </header>
  <div class="desk">
    <section class="chat" aria-label="Briefing">
      <div id="transcript" class="transcript" aria-live="polite"></div>
      <form id="ask">
        <div id="starters" class="starters"></div>
        <label class="query">
          <span class="visually-hidden">Question</span>
          <textarea id="query" name="query" rows="2" placeholder="Ask about a PEP, a count, or a function in the code bundle" required></textarea>
        </label>
        <div class="ask-row">
          <button id="send" type="submit">Ask</button>
          <p id="status" class="status" role="status"></p>
        </div>
      </form>
    </section>
    <aside class="trace-panel" aria-label="Live trace">
      <h2>Trace</h2>
      <ol id="trace"></ol>
    </aside>
  </div>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
